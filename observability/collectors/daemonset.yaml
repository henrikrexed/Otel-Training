# DaemonSet (node) collector — node/pod log collection.
#
# Runs one collector per node (tolerates the control-plane taint: the kind
# cluster is single-node). Parses CRI container logs, stamps k8s identity
# parsed from the /var/log/pods path onto the resource, and forwards over OTLP
# to the gateway collector — the gateway owns enrichment + Dynatrace export.
#
# Deliberately minimal pipeline (memory_limiter first, batch last): the
# k8sattributes and cumulativetodelta stages live on the gateway
# (collectors/gateway.yaml), which is the single aggregation + export tier.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-logs
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-logs
    app.kubernetes.io/component: node-logs-collector
spec:
  mode: daemonset
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0
  tolerations:
    # kind clusters are single control-plane nodes: without this toleration
    # no DaemonSet pod would schedule anywhere.
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibcontainerd
      hostPath:
        path: /var/lib/containerd
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibcontainerd
      mountPath: /var/lib/containerd
      readOnly: true
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      filelog:
        # CRI layout: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Skip our own collector namespaces to avoid a feedback loop
          # (gateway re-logging what the agent ships).
          - /var/log/pods/observability_*/*/*.log
          - /var/log/pods/opentelemetry-operator-system_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # Stamp k8s identity from the file path so the gateway's
          # k8sattributes processor can associate on these attributes.
          # (Go regexp forbids dots in named captures, so capture plain names
          # and move them onto dotted resource attributes.)
          - id: parse-k8s-path
            type: regex_parser
            parse_from: attributes["log.file.path"]
            regex: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_(?P<uid>[^/]+)/(?P<container>[^/]+)/(?P<restart_count>\d+)\.log'
          - id: k8s-namespace
            type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - id: k8s-pod-name
            type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]
          - id: k8s-pod-uid
            type: move
            from: attributes.uid
            to: resource["k8s.pod.uid"]
          - id: k8s-container
            type: move
            from: attributes.container
            to: resource["k8s.container.name"]
          # CRI runtime (containerd) writes one JSON object per line.
          - id: parse-cri
            type: json_parser
            parse_from: body
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: "2006-01-02T15:04:05.000000000Z07:00"
          - id: move-log-stream
            type: move
            from: attributes.stream
            to: attributes["log.iostream"]
          - id: move-log-body
            type: move
            from: attributes.log
            to: body

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 180
        spike_limit_mib: 50
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024

    exporters:
      otlp/gateway:
        endpoint: http://otel-gateway-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 512

    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
      telemetry:
        logs:
          level: info
