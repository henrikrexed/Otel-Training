# PLACEHOLDER casino manifest — SUPERSEDED by the real manifests from ISI-6794.
#
# ISI-6794 has landed: the canonical casino manifests now live in
# deploy/casino/k8s and are the default CASINO_MANIFESTS_DIR in
# gitops/install/seed-gitea.sh. This file is retained only as a fallback /
# minimal demo — seed it with `CASINO_MANIFESTS_DIR=gitops/seed/k8s` if you want
# the original single-knob (replicas) GitOps loop without the full app.
#
# This exists so the GitOps plumbing (Gitea -> Argo CD -> cluster) is healthy,
# synced, and demonstrable with a trivial workload.
#
# It is intentionally tiny and has one obvious knob — `replicas` — so the lab can
# demo the loop immediately: edit replicas 1 -> 3, commit, push, watch Argo CD
# scale the Deployment on the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-placeholder
  labels:
    app: casino-placeholder
    app.kubernetes.io/part-of: casino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casino-placeholder
  template:
    metadata:
      labels:
        app: casino-placeholder
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
