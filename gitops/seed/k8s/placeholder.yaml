# PLACEHOLDER casino manifest — REPLACE with the real manifests from ISI-6794.
#
# This exists so the GitOps plumbing (Gitea -> Argo CD -> cluster) is healthy,
# synced, and demonstrable before the casino app-deploy ticket (ISI-6794) lands.
# Once ISI-6794 publishes the canonical casino manifests, point
# CASINO_MANIFESTS_DIR (gitops/install/seed-gitea.sh) at that directory and the
# next seed pushes the real app in place of this.
#
# It is intentionally tiny and has one obvious knob — `replicas` — so the lab can
# demo the loop immediately: edit replicas 1 -> 3, commit, push, watch Argo CD
# scale the Deployment on the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-placeholder
  labels:
    app: casino-placeholder
    app.kubernetes.io/part-of: casino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casino-placeholder
  template:
    metadata:
      labels:
        app: casino-placeholder
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
