# kind cluster for the OTel training codespace.
#
# Single control-plane node (which also schedules workloads) to fit a 4-core /
# 8 GB codespace while still running the Vegas Casino app + collectors + the
# Dynatrace operator. For beefier machines, add `- role: worker` entries.
#
# The control-plane node publishes 80/443 (Gateway API / ingress — ISI-6795) and
# a small NodePort band so attendees can reach services from the codespace.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# containerd registry wiring for the in-cluster Gitea container registry (ISI-7638,
# WS-D of ISI-7624). Point containerd's registry config at the per-host certs.d
# directory so the hosts.toml written by create-cluster.sh takes effect. This is
# the standard kind "insecure local-registry mirror" pattern and the single lever
# that lets node-level containerd pull images that the Gitea Packages registry
# serves over plain http. It is additive and harmless to the default running state:
# with no certs.d entry for ghcr.io/docker.io, those registries resolve exactly as
# before, so the GHCR public-image bootstrap (D1) is unaffected.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # Pin the node image for reproducibility; bump alongside KIND_VERSION.
    image: kindest/node:v1.31.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
