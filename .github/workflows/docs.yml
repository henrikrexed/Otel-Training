name: docs

# Build the MkDocs attendee guide, verify mermaid renders in both the default
# (light) and slate (dark) palettes, and deploy to GitHub Pages from main.
# ISI-6929 (ISI-6913 §3/§6).

on:
  push:
    branches: ["main"]
    paths:
      - "mkdocs.yml"
      - "docs-site/**"
      - "requirements-docs.txt"
      - "scripts/check_docs_mermaid.py"
      - "scripts/render_palettes.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs-site/**"
      - "requirements-docs.txt"
      - "scripts/check_docs_mermaid.py"
      - "scripts/render_palettes.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Static mermaid/nav checks
        run: python scripts/check_docs_mermaid.py site

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render check — mermaid in both palettes
        run: python scripts/render_palettes.py site

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    # Publish to GitHub Pages only from main, after the build+render gate passes.
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
