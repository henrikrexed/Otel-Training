          - "A2 — Log ↔ trace correlation [20m][med]": advanced/catalog-a2-log-trace-correlation.md
          - "A3 — Multi-language instrumentation [25m][med]": advanced/catalog-a3-multi-language.md
          - "A4 — Exceptions / span-events [20m][med]": advanced/catalog-a4-exceptions-span-events.md
          - "A5 — Baggage propagation (player.tier) [25m][med]": advanced/catalog-a5-baggage-propagation.md
          - "B1 — RED metrics from spans [20m][med]": advanced/catalog-b1-spanmetrics.md
