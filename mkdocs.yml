site_name: Beyond the Honeymoon — OTel in Practice
site_description: Attendee lab walkthrough for the 3h Dynatrace Perform hands-on OpenTelemetry training on the Vegas Casino
site_author: Henrik Rexed / IsItObservable

docs_dir: docs-site
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # mkdocs-mermaid2-plugin clashes with Material's native superfences mermaid
  # handling (ISI-6913 §4.2). The fix is to register a custom fence that hands
  # ```mermaid blocks to mermaid2.fence_mermaid instead of letting superfences
  # syntax-highlight them. With this in place the two coexist: superfences emits
  # <pre class="mermaid"> and the mermaid2 plugin renders it client-side.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Welcome: index.md
  - M0 — Environment Setup: setup.md
  - M1 — Tour the broken casino: module-1.md
  - M2 — SDK configuration by file: module-2.md
  - M3 — The collector as control point: module-3.md
  - "M4 — Sampling: cost/fidelity strategy": module-4.md
  - M5 — Operating at scale: module-5.md
  - Troubleshooting: troubleshooting.md
  # Option A (ISI-6913): new advanced self-paced track ALONGSIDE M0–M5.
  # Pages are stubs pending §2 content authoring (ISI-6930).
  - Advanced self-paced track:
      - Getting started: advanced/getting-started.md
      - The environment: advanced/environment.md
      - Step 1 — Instrument with AI agents: advanced/step-1-instrument-with-agents.md
      - Step 2 — Weaver pipeline: advanced/step-2-weaver-pipeline.md
      - Step 3 — Cost of observability: advanced/step-3-cost-of-observability.md
      - Step 4 — High-cardinality metrics: advanced/step-4-high-cardinality.md
      - Step 5 — PII in logs: advanced/step-5-pii-logs.md
      - Step 6 — Tail sampling: advanced/step-6-tail-sampling.md

plugins:
  - search
  # Pinned in requirements-docs.txt (mkdocs-mermaid2-plugin==1.2.3).
  # theme is a raw-JS expression (the leading ^) so each diagram follows the
  # Material palette the attendee has selected: slate -> dark, default -> light.
  - mermaid2:
      version: 10.9.1
      arguments:
        # Raw-JS expression (leading ^) evaluated at page load, so each diagram
        # follows the Material palette the attendee has selected: slate -> dark,
        # default -> light. Material persists the choice in localStorage, so a
        # reload after toggling re-renders the diagrams in the new palette.
        # NB: do NOT add an `extra_javascript:` entry here — mermaid2 1.2.x
        # misreads the first extra_javascript as the mermaid library override
        # and then skips loading the real runtime (diagrams silently fail).
        theme: |
          ^(window.matchMedia && JSON.parse(window.localStorage.getItem("__palette") || "{}")?.color?.scheme === "slate") ? "dark" : "default"
