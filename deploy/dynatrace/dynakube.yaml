# DynaKube — OTel Training cluster, KUBERNETES-MONITORING mode.
#
# This is the config-as-code source of record for ISI-6793. It tells the
# Dynatrace Operator to register this kind cluster for *Kubernetes monitoring*
# (K8s API observability via an in-cluster ActiveGate) and NOTHING ELSE.
#
# Why no `oneAgent` section?
#   The training drives all application telemetry (traces/metrics/logs for the
#   Vegas Casino services) through the OpenTelemetry collectors. Enabling OneAgent
#   cloud-native / application monitoring here would auto-inject the agent and
#   DOUBLE-INGEST those same app signals into the tenant. Omitting `oneAgent`
#   leaves app observability entirely to OTel and keeps Dynatrace focused on the
#   Kubernetes layer (cluster, nodes, workloads, events) — clean coexistence,
#   no conflict. See deploy/dynatrace/README.md §"Coexistence with OTel".
#
# ISI-7565 — matched to a PROVEN-WORKING reference.
#   ISI-7547/ISI-7553 chased the AG `Init:ImagePullBackOff` twice on hypothesis
#   (added `use-public-registry`) and it still failed. The board supplied a
#   known-good deployment that stands the same ActiveGate up with NO trouble:
#   henrikrexed/dynatrace-AI-Agent-Workshop (cluster/dynatrace/dynakube.yaml).
#   That reference pulls the AG from the DEFAULT (tenant) registry — no
#   `use-public-registry` — and works with platform tokens (dt0s16). This DynaKube
#   adopted the reference's shape:
#     * ActiveGate capability `kubernetes-monitoring` ONLY (no routing/dynatrace-api),
#     * per-attendee cluster NAME via the api-monitoring-cluster-name annotation
#       (the reference's isolation mechanism) instead of `networkZone`,
#     * `metadataEnrichment: enabled`.
#
# ISI-7674 — tenant-aware ActiveGate image source (reconciles the whole saga).
#   The reference above runs on a LIVE/prod tenant (`<env>.live.dynatrace.com`),
#   whose tenant registry HOSTS the ActiveGate image. Our codespace points at an
#   internal DEV/sprint tenant (`oat05854.dev.dynatracelabs.com`) whose registry
#   does NOT serve the AG image, so the pull 404s regardless of token type — the
#   board confirmed it still `ErrImagePull`s with BOTH tokens swapped to platform
#   (dt0s16). The fix is tenant-aware: for dev/sprint tenants pull the AG from the
#   PUBLIC registry (`public.ecr.aws/dynatrace`, which hosts it for every tenant)
#   via `feature.dynatrace.com/use-public-registry`; for a live tenant the default
#   tenant-registry pull (reference path) is correct. install.sh AUTO-DETECTS the
#   tenant class from the apiUrl host and renders this flag accordingly — "true"
#   for *.dev/*.sprint.dynatracelabs.com, "false" (== default/omitted behaviour)
#   for *.live.dynatrace.com — so the proven live path is byte-for-byte unchanged.
#   ISI-7553 had the RIGHT lever for a dev tenant; it only "failed" because it was
#   tested with classic tokens and an un-rolled pod. The ISI-7673 classic-token
#   fail-fast guardrail still stands (classic tokens 404 the tenant registry on a
#   live tenant) but was NOT the dev-tenant fix: dev tenants need platform tokens
#   AND public registry. Override the auto-detect with DT_USE_PUBLIC_REGISTRY.
#
# apiUrl and the token Secret are injected at install time by install.sh from the
# per-attendee DT_* env (devcontainer secrets) — never hard-coded here. The
# placeholders below are replaced by `envsubst`; apply via install.sh, not raw
# `kubectl apply`, unless you have already substituted them.
# apiVersion pinned to the DynaKube storage version served by the operator we
# install (1.11.x serves v1beta5 + v1beta6; v1beta6 is storage). Verified against
# the chart's CRD — see README §"API version pin". Bump together with the operator.
apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: ${DYNAKUBE_NAME}
  namespace: dynatrace
  annotations:
    # Let the operator create/maintain the Kubernetes API monitoring setting in the
    # tenant automatically, so the cluster shows up under Kubernetes monitoring
    # without a manual settings step. (Default-on in recent operators; set
    # explicitly so behaviour is obvious and stable across versions.)
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"
    # Per-attendee cluster NAME in Dynatrace Kubernetes API monitoring on the shared
    # tenant, so many attendees stay readable at once. This replaces the old
    # `networkZone` approach and matches the proven reference deployment. Rendered
    # from ${DYNAKUBE_NAME} by install.sh's envsubst (same step that injects apiUrl).
    feature.dynatrace.com/automatic-kubernetes-api-monitoring-cluster-name: "${DYNAKUBE_NAME}"
    # ISI-7674 — tenant-aware ActiveGate image source. Dev/sprint tenants'
    # internal registries do NOT serve the AG image (the pull 404s regardless of
    # token type), so install.sh renders this "true" for *.dev / *.sprint
    # .dynatracelabs.com to pull the AG from public.ecr.aws/dynatrace (which hosts
    # it for every tenant). For a live/prod tenant the AG lives in the tenant
    # registry (the proven reference path), so this renders "false" — identical in
    # effect to omitting the flag (the operator default). Auto-detected from the
    # apiUrl host; force either way with DT_USE_PUBLIC_REGISTRY. Rendered by
    # install.sh's envsubst. See README §"Live vs dev/sprint tenant registry".
    feature.dynatrace.com/use-public-registry: "${DT_USE_PUBLIC_REGISTRY}"
spec:
  # Tenant API endpoint, e.g. https://abc12345.live.dynatrace.com/api
  apiUrl: ${DT_API_URL}

  # Name of the Secret (same namespace) holding `apiToken` and `dataIngestToken`.
  # Created by install.sh from DT_OPERATOR_TOKEN / DT_INGEST_TOKEN — both PLATFORM
  # tokens (dt0s16) on this Gen3 tenant. The operator apiToken MUST carry the
  # ActiveGate scopes (fleet-management:activegate.tokens:create +
  # fleet-management:activegate.connection-info:read) so the operator can mint the
  # tenant-registry pull-secret for the AG image — see README token scopes. By
  # convention the operator looks for a Secret named after the DynaKube when
  # `tokens` is unset; we set it explicitly.
  tokens: ${DYNAKUBE_NAME}

  # Enrich pod/workload Kubernetes metadata (dt.kubernetes.*) into logs & OTLP
  # signals for correlation. Pure enrichment — it labels signals, it does NOT
  # inject OneAgent or ingest app traces/metrics/logs, so it preserves the
  # ISI-6793 "OTel owns app signals, no double-ingest" guarantee. Present in the
  # reference deployment too.
  metadataEnrichment:
    enabled: true

  # --- Kubernetes monitoring via an in-cluster ActiveGate -------------------
  # The `kubernetes-monitoring` capability is what registers this cluster for
  # Kubernetes observability. We run ONLY this capability (matching the reference);
  # `routing` / `dynatrace-api` are not needed for K8s monitoring on a single-node
  # kind cluster and are omitted to keep the AG minimal.
  activeGate:
    capabilities:
      - kubernetes-monitoring
    # Keep the ActiveGate inside a 4-core / 8 GB codespace budget (reference sizing).
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        memory: 1Gi

  # NOTE: intentionally NO `oneAgent:` block. See header comment.
