# EXAMPLE token Secret for the DynaKube — DO NOT COMMIT REAL TOKENS.
#
# In the training this Secret is created by install.sh from the per-attendee
# DT_API_TOKEN / DT_INGEST_TOKEN env (devcontainer/Codespaces secrets), so you
# normally never apply this file. It is kept as documentation of the exact shape
# the operator expects: a Secret in the `dynatrace` namespace, named after the
# DynaKube, with two keys.
#
#   apiToken        -> Dynatrace API token used by the operator/ActiveGate
#   dataIngestToken -> data-ingest token for metrics/logs/events
#
# Required token scopes are documented in README.md §"Token scopes".
#
# To create it by hand (equivalent to what install.sh does):
#   kubectl create secret generic otel-training \
#     --namespace dynatrace \
#     --from-literal=apiToken="$DT_API_TOKEN" \
#     --from-literal=dataIngestToken="$DT_INGEST_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: otel-training        # must match the DynaKube `spec.tokens` / metadata.name
  namespace: dynatrace
type: Opaque
stringData:
  apiToken: "dt0c01.REPLACE_ME.API_TOKEN"
  dataIngestToken: "dt0c01.REPLACE_ME.DATA_INGEST_TOKEN"
