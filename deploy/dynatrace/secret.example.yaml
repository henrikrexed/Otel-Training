# EXAMPLE token Secret for the DynaKube — DO NOT COMMIT REAL TOKENS.
#
# In the training this Secret is created by install.sh from the per-attendee
# DT_OPERATOR_TOKEN / DT_INGEST_TOKEN env (devcontainer/Codespaces secrets), so
# you normally never apply this file. It is kept as documentation of the exact
# shape the operator expects: a Secret in the `dynatrace` namespace, named after
# the DynaKube, with two keys.
#
#   apiToken        -> DT_OPERATOR_TOKEN: platform token (dt0s16), fleet-management
#                      + settings IAM scopes. Used by the operator/ActiveGate.
#   dataIngestToken -> DT_INGEST_TOKEN:  platform token (dt0s16), openpipeline +
#                      storage IAM scopes. Also used by the OTel collectors for OTLP.
#
# The key names stay `apiToken` / `dataIngestToken` — operator 1.10.0+ accepts a
# platform token in those keys (auto-detected by the `dt0s16` prefix).
# Required token scopes are documented in README.md §"Token scopes".
#
# To create it by hand (equivalent to what install.sh does):
#   kubectl create secret generic otel-training \
#     --namespace dynatrace \
#     --from-literal=apiToken="$DT_OPERATOR_TOKEN" \
#     --from-literal=dataIngestToken="$DT_INGEST_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: otel-training        # must match the DynaKube `spec.tokens` / metadata.name
  namespace: dynatrace
type: Opaque
stringData:
  apiToken: "dt0s16.REPLACE_ME.OPERATOR_PLATFORM_TOKEN"
  dataIngestToken: "dt0s16.REPLACE_ME.INGEST_PLATFORM_TOKEN"
