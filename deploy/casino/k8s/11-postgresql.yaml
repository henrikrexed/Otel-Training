# PostgreSQL — persistence store for the scoring service. emptyDir (no PVC):
# per-attendee throwaway cluster, data does not need to survive a pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegas-casino-postgresql
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vegas-casino
      app.kubernetes.io/instance: vegas-casino
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vegas-casino
      containers:
        - name: postgresql
          securityContext:
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          image: "postgres:15-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "vegas_casino"
            - name: POSTGRES_USER
              value: "vegas_user"
            - name: POSTGRES_PASSWORD
              value: "vegas_password"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U vegas_user"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U vegas_user"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgresql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vegas-casino-postgresql
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/component: postgresql
