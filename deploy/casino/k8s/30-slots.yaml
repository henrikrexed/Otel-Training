# Slots game service (Node.js). http 8081 / gRPC 50051.
# M1 planted defects (broken OTel import path, missing logger provider;
# labs/defects.md #1 & #3) are baked into the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegas-casino-slots
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: slots
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vegas-casino
      app.kubernetes.io/instance: vegas-casino
      app.kubernetes.io/component: slots
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: slots
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/health"
    spec:
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vegas-casino
      containers:
        - name: slots-service
          securityContext:
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          image: "ghcr.io/henrikrexed/vegasapp-slots:0.39"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: GRPC_PORT
              value: "50051"
            - name: SERVICE_NAME
              value: "vegas-slots-service"
            - name: OTEL_SERVICE_NAME
              value: "vegas-slots-service"
            - name: OTEL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: OTEL_SERVICE_VERSION
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=vegas-slots-service,service.version=2.1.0,service.namespace=vegas-casino,deployment.environment=production,application.name=Vegas-Casino-slot-machines,game.category=slot-machines,game.complexity=high,game.max_payout=100x,game.type=slots-machine,game.owner=Slot-Machine-Division"
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: SERVICE_NAMESPACE
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: K8S_CLUSTER_NAME
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # PLANTED DEFECT D1 (ISI-6790): slots still correlates via the
            # legacy in-house header from the 2021 framework instead of W3C
            # Trace Context -> every slots request becomes an orphan trace.
            # Fixed in Module 1 of the training docs-site.
            - name: OTEL_PROPAGATORS
              value: "vegas-legacy"
            - name: REDIS_HOST
              value: "vegas-casino-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: SCORING_SERVICE_URL
              value: "http://vegas-casino-scoring:8085"
            - name: GAME_CATEGORY
              value: "slot-machines"
            - name: GAME_COMPLEXITY
              value: "high"
            - name: GAME_MAX_PAYOUT
              value: "100x"
            - name: GAME_TYPE
              value: "slots-machine"
            - name: GAME_OWNER
              value: "Slot-Machine-Division"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vegas-casino-slots
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: slots
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
    - port: 50051
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/component: slots
