# k6 load generator — drives continuous user traffic against the frontend so the
# casino emits a steady stream of telemetry (and the planted defects stay visible
# downstream) for the whole training session, with no manual clicking.
#
# Modelled as a Job (not a Deployment): k6 runs one long test for DURATION then
# exits cleanly. DURATION is sized to cover a ~3h session. To re-run after it
# completes, delete the Job and let Argo CD recreate it, or bump DURATION.
# VUS is kept low (3) to stay within the per-attendee cluster budget.
#
# The init container waits for the frontend /health before starting load, but is
# non-fatal (exits 0 on timeout) so k6 still attempts the run.
apiVersion: batch/v1
kind: Job
metadata:
  name: vegas-casino-loadgen
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: loadgen
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: loadgen
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-frontend
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for frontend service to be ready..."
              FRONTEND_URL="http://vegas-casino-frontend:3000"
              for i in $(seq 1 60); do
                if curl -f -s --max-time 5 "$FRONTEND_URL/health" > /dev/null 2>&1; then
                  echo "Frontend service is ready."
                  exit 0
                fi
                if [ $((i % 6)) -eq 0 ]; then
                  echo "Attempt $i/60: frontend not ready yet, waiting..."
                fi
                sleep 5
              done
              echo "Frontend did not become ready in 5 minutes (non-fatal); k6 will try anyway."
              exit 0
      containers:
        - name: k6
          image: "ghcr.io/henrikrexed/vegasapp-k6:0.39"
          imagePullPolicy: IfNotPresent
          env:
            - name: CASINO_URL
              value: "http://vegas-casino-frontend:3000"
            - name: VUS
              value: "3"
            - name: DURATION
              value: "3h"
            - name: RAMP_UP
              value: "30s"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
