# Dashboard service (Node.js) — leaderboard / game-results UI backend.
# http 3001 / gRPC 50055.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegas-casino-dashboard
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vegas-casino
      app.kubernetes.io/instance: vegas-casino
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/health"
    spec:
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vegas-casino
      containers:
        - name: dashboard
          securityContext:
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          image: "ghcr.io/henrikrexed/vegasapp-dashboard:0.39"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: grpc
              containerPort: 50055
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: GRPC_PORT
              value: "50055"
            - name: SERVICE_NAME
              value: "vegas-dashboard-service"
            - name: OTEL_SERVICE_NAME
              value: "vegas-dashboard-service"
            - name: OTEL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: OTEL_SERVICE_VERSION
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=vegas-dashboard-service,service.version=2.1.0,service.namespace=vegas-casino,deployment.environment=production,application.name=Vegas-Casino-Dashboard"
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: SERVICE_NAMESPACE
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: K8S_CLUSTER_NAME
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: SCORING_SERVICE_URL
              value: "http://vegas-casino-scoring:8085"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vegas-casino-dashboard
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: http
      protocol: TCP
      name: http
    - port: 50055
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/component: dashboard
