# Frontend service (Node.js) — the casino web UI and the entry point for every
# user journey. Fans out to the game services over gRPC and to scoring/dashboard
# over HTTP, so it is the root of the distributed trace. http 3000.
#
# Reach it in-cluster via the ClusterIP Service below; for a human, port-forward:
#   kubectl -n casino port-forward svc/vegas-casino-frontend 3000:3000
# then open http://localhost:3000.
#
# For browser access from OUTSIDE the devcontainer (so attendees can play and
# drive load), ISI-6795 adds Gateway API routing: 70-gateway.yaml +
# 71-httproute.yaml route the casino Gateway's :80 listener to this Service, and
# NGINX Gateway Fabric (installed by deploy/gateway/install.sh) exposes it on
# NodePort 30000 -> the forwarded :30000 URL. The in-cluster ClusterIP path
# below still works and remains the fallback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegas-casino-frontend
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vegas-casino
      app.kubernetes.io/instance: vegas-casino
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vegas-casino
      containers:
        - name: frontend
          securityContext:
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          image: "ghcr.io/henrikrexed/vegasapp-frontend:0.39"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: "vegas-frontend-service"
            - name: OTEL_SERVICE_NAME
              value: "vegas-frontend-service"
            - name: OTEL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: OTEL_SERVICE_VERSION
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=vegas-frontend-service,service.version=2.1.0,service.namespace=vegas-casino,deployment.environment=production,application.name=Vegas-Casino-Frontend"
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: SERVICE_NAMESPACE
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: vegas-casino-config
                  key: K8S_CLUSTER_NAME
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # PLANTED DEFECTS D2/D3 (ISI-6790): per-player metric breakdown
            # "requested by analytics" adds an unbounded player_id dimension
            # to casino.bet.amount (fixed in Module 3); verbose compliance
            # audit logging ships raw email/IP in login_audit logs (fixed in
            # Module 3).
            - name: CASINO_PLAYER_LEVEL_METRICS
              value: "true"
            - name: AUDIT_LOG_VERBOSITY
              value: "verbose"
            # gRPC game-service endpoints
            - name: SLOTS_SERVICE_GRPC
              value: "vegas-casino-slots:50051"
            - name: ROULETTE_SERVICE_GRPC
              value: "vegas-casino-roulette:50052"
            - name: DICE_SERVICE_GRPC
              value: "vegas-casino-dice:50053"
            - name: BLACKJACK_SERVICE_GRPC
              value: "vegas-casino-blackjack:50054"
            - name: DASHBOARD_SERVICE_GRPC
              value: "vegas-casino-dashboard:50055"
            # HTTP fallback endpoints
            - name: SLOTS_SERVICE_URL
              value: "http://vegas-casino-slots:8081"
            - name: ROULETTE_SERVICE_URL
              value: "http://vegas-casino-roulette:8082"
            - name: DICE_SERVICE_URL
              value: "http://vegas-casino-dice:8083"
            - name: BLACKJACK_SERVICE_URL
              value: "http://vegas-casino-blackjack:8084"
            # Redis + scoring
            - name: REDIS_HOST
              value: "vegas-casino-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: SCORING_SERVICE_URL
              value: "http://vegas-casino-scoring:8085"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vegas-casino-frontend
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/component: frontend
